# XcodeGen 프로젝트 설정 파일
# 사용법:
#   brew install xcodegen
#   cd /Users/jeongyong/workspace/MMM   ← MMM 루트에서 실행
#   xcodegen generate
#
# 이 파일 하나로 NinetyNine.xcodeproj가 자동 생성됩니다.

name: NinetyNine
options:
  bundleIdPrefix: dragonbear
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9B3VHPRH5L"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  NinetyNine:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NinetyNine/App
      - path: NinetyNine/Core
      - path: NinetyNine/Features
      - path: NinetyNine/Shared
        excludes:
          - Components   # 현재 빈 폴더 — 파일 추가 시 제거
      - path: NinetyNine/Resources
        buildPhase: resources
        excludes:
          - "Info.plist"   # INFOPLIST_FILE 설정이 처리 — 중복 방지
        rules:
          - pattern: "*.json"
          - pattern: "*.plist"
          - pattern: "*.caf"
          - pattern: "*.wav"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dragonbear.NinetyNine
        INFOPLIST_FILE: NinetyNine/Resources/Info.plist
        DEVELOPMENT_ASSET_PATHS: NinetyNine/Resources/Preview\ Content
    entitlements:
      path: NinetyNine/NinetyNine.entitlements
    capabilities:
      - com.apple.Push
      - com.apple.SignInWithApple
      - com.apple.BackgroundModes
    dependencies:
      # WeatherKit + CoreLocation (시스템 프레임워크)
      - sdk: WeatherKit.framework
      - sdk: CoreLocation.framework
      # Firebase (Firebase 패키지 하나에서 여러 product 사용)
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      # 이미지 캐싱
      - package: Kingfisher

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"
